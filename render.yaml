# Render blueprint for the backend (docs/runbooks/deploy.md, "Backend on Render").
# Secret values are asked for in the Render dashboard, never stored here (sync: false).
services:
  - type: web
    name: contracttracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    # Open without a login (every /api route needs one now); answers 200 when the process is up.
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: LLM_MODEL
        value: anthropic/claude-haiku-4.5
      - key: LLM_BUDGET_STOP_USD
        value: "1.80"
      - key: LLM_BUDGET_SINCE
        value: "2026-10-05"
      - key: REMINDER_TO
        value: owner@contracttracker.test
      - key: DATABASE_URL
        sync: false
      # Signs the login cookie: at least 32 random characters, set in the Render dashboard.
      - key: SESSION_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
