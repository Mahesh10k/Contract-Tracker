# Render blueprint for the backend (docs/runbooks/deploy.md, "Backend on Render").
# Secret values are asked for in the Render dashboard, never stored here (sync: false).
services:
  - type: web
    name: contracttracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    # The API has no health route of its own; this one answers 200 when the database is reachable.
    healthCheckPath: /api/contracts
    envVars:
      - key: ENV
        value: production
      - key: LLM_MODEL
        value: anthropic/claude-haiku-4.5
      - key: LLM_BUDGET_STOP_USD
        value: "1.80"
      - key: LLM_BUDGET_SINCE
        value: "2026-10-05"
      - key: REMINDER_TO
        value: owner@contracttracker.test
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
